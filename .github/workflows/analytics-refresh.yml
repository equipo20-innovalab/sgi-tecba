name: Refresh analytics database

# Construye el padrón de habilitaciones, lo valida y lo recarga en un PostgreSQL
# efímero creado como servicio del job. No usa secretos: la base vive en el
# runner, así que el workflow funciona igual en main, en dispatch y en schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches:
      - main
    paths:
      - "data_analytics/innovalab/data/raw/**"
      - "data_analytics/innovalab/data/geo/**"
      - "data_analytics/innovalab/src/**"
      - "data_analytics/innovalab/db/schema.sql"
      - "data_analytics/innovalab/db/seed/**"
      - "data_analytics/innovalab/requirements.txt"
      - ".github/workflows/analytics-refresh.yml"

permissions:
  contents: read

env:
  DIR_DATOS: data_analytics/innovalab
  DATABASE_URL: postgresql://innovalab:innovalab@127.0.0.1:5432/innovalab
  PGPASSWORD: innovalab

jobs:
  refresh:
    name: Build, validación y recarga
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: innovalab
          POSTGRES_USER: innovalab
          POSTGRES_PASSWORD: innovalab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U innovalab -d innovalab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_analytics/innovalab/requirements.txt

      - name: Instalar dependencias
        working-directory: ${{ env.DIR_DATOS }}
        run: python -m pip install -r requirements.txt

      - name: Asegurar cliente de PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Aplicar esquema
        working-directory: ${{ env.DIR_DATOS }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql

      - name: Correr tests
        working-directory: ${{ env.DIR_DATOS }}
        run: python -m pytest tests/ -v

      - name: Construir, validar y recargar
        working-directory: ${{ env.DIR_DATOS }}
        run: python -m src.run_pipeline

      - name: Verificar conteos en la base
        run: |
          hab=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM habilitaciones")
          cu=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM codigo_urbanistico")
          urb=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM urbanismo_smp")
          echo "habilitaciones=$hab codigo_urbanistico=$cu urbanismo_smp=$urb"
          test "$hab" -gt 0
          test "$cu" -gt 0
          test "$urb" -gt 0
