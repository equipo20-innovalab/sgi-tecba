name: Refresh analytics database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches:
      - main
    paths:
      - "data_analytics/innovalab/data/raw/**"
      - "data_analytics/innovalab/data/geo/**"
      - "data_analytics/innovalab/src/**"
      - "data_analytics/innovalab/db/schema.sql"
      - "data_analytics/innovalab/db/seed/**"
      - "data_analytics/innovalab/requirements.txt"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_analytics/innovalab/requirements.txt

      - name: Install dependencies
        working-directory: data_analytics/innovalab
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: data_analytics/innovalab
        run: python -m pytest tests/ -v

      - name: Build, validate, and refresh PostgreSQL
        working-directory: data_analytics/innovalab
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.run_pipeline